version: "3"

services:
  db:
    container_name: gymBD
    hostname: gymBD
    image: mysql # Por padrão, usará a última versão do MySQL
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb_force_recovery=0 # Idealmente, não use innodb_force_recovery em desenvolvimento normal. Remova se não for um requisito específico.
    ports:
      - "3306:3306" # Mapeia a porta 3306 do container para a porta 3306 do seu host
    environment:
      MYSQL_DATABASE: gym
      MYSQL_ROOT_PASSWORD: SilenceIsGolden
    volumes: # Adicionado para persistência de dados
      - gym_db_data:/var/lib/mysql

volumes: # Adicionado para persistência de dados
  gym_db_data: